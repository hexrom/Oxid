[package]
name = "oxid"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "=1.0.89"
clap = { version = "=4.5.20", features = ["derive"] }
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "blocking", "rustls-tls"] }
rustsec = "=0.25.1"
rayon = "=1.10.0"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
thiserror = "=1.0.64"
home = "=0.5.11"
owo-colors = "=4.1.0"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["fmt"] }
indicatif = "=0.17.9"
toml = "=0.5.11"
url = "=2.4.1"

